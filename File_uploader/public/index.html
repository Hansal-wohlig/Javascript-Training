<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Uploader Demo</title>
</head>
<body>
  <h1>Upload a File</h1>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="myFile" required />
    <button type="submit">Upload</button>
  </form>

  <h1>Upload Multiple .js Files</h1>
  <form action="/upload-multiple" method="POST" enctype="multipart/form-data">
    <!-- accept only .js files, allow selecting multiple -->
    <input type="file" name="myFiles" accept=".js" multiple required />
    <button type="submit">Upload Scripts</button>
  </form>
</body>
</html>
